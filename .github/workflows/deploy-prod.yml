name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fandazi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          test -n "$ECS_SSH_KEY"
          test -n "$ECS_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend and upload miniapp from ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          test -n "$ECS_USER"
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$ECS_USER@$ECS_HOST" <<'EOF'
            set -Eeuo pipefail
            cd /opt/fandazi

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose \
              --env-file backend/.env \
              -f backend/compose.yaml \
              up -d --build --wait --wait-timeout 60

            docker compose \
              --env-file backend/.env \
              -f backend/compose.yaml \
              ps

            curl -fsS http://127.0.0.1:3100/health
            curl -fsS https://fandazi-api.coder-f-nowork.cn/api/v1/bootstrap >/dev/null

            MINIAPP_VERSION="$(date -u +%Y.%m%d.%H%M%S)"
            MINIAPP_DESCRIPTION="main $(git rev-parse --short HEAD)"
            docker run --rm \
              -e MINIAPP_VERSION="$MINIAPP_VERSION" \
              -e MINIAPP_DESCRIPTION="$MINIAPP_DESCRIPTION" \
              -v /opt/fandazi:/workspace \
              -v /root/.config/fandazi/private.wx7fce988b19eee10d.key:/run/secrets/wechat-upload.key:ro \
              -v fandazi-pnpm-store:/pnpm/store \
              -w /workspace \
              node:22-alpine \
              sh -lc '
                corepack enable
                corepack prepare pnpm@11.19.0 --activate
                pnpm config set store-dir /pnpm/store
                pnpm install --filter dazi-for-meals... --frozen-lockfile
                pnpm build:frontend
                pnpm --dir frontend upload:mp-weixin \
                  --pkp /run/secrets/wechat-upload.key \
                  --uv "$MINIAPP_VERSION" \
                  --ud "$MINIAPP_DESCRIPTION" \
                  -r 1
              '

            echo "Fandazi backend deployed and miniapp uploaded"
          EOF
