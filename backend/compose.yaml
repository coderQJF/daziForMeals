services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fandazi
      POSTGRES_USER: fandazi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes:
      - fandazi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandazi -d fandazi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: fandazi-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://coder-f-nowork.cn}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://img.coder-f-nowork.cn/static}
      DATABASE_URL: postgres://fandazi:${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}@db:5432/fandazi
      WECHAT_APP_ID: ${WECHAT_APP_ID:?Set WECHAT_APP_ID in backend/.env}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?Set WECHAT_APP_SECRET in backend/.env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in backend/.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fandazi-db-data:
